<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AWS S3 Static Website</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1d4ed8);
            color: white;
            text-align: center;
        }
        .container {
            width: min(90%, 700px);
            padding: 50px 30px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }
        h1 { font-size: 3rem; margin-bottom: 15px; }
        p { font-size: 1.15rem; line-height: 1.7; color: #dbeafe; }
        .badge {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            border-radius: 999px;
            background: #f59e0b;
            color: #111827;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>🚀 Website is Live!</h1>
        <p>
            This static website is hosted using
            <strong>Amazon S3 Static Website Hosting</strong>.
        </p>
        <span class="badge">AWS S3</span>
    </main>
</body>
</html>
